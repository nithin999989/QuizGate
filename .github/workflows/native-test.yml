name: native-test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-test
  cancel-in-progress: false
jobs:
  native-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore binary assets
        run: bash quizgate-redesign/ci/restore-binaries.sh
      - name: Build app
        working-directory: quizgate-redesign
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: Emulator evidence run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          emulator-options: -no-snapshot-save -no-window -no-audio -gpu swiftshader_indirect
          script: bash quizgate-redesign/ci/run-emulator-tests.sh
      - name: Emit evidence to log
        if: always()
        working-directory: quizgate-redesign
        run: |
          for f in shots/*.txt shots/*.xml; do [ -f "$f" ] || continue; echo "===== EVIDENCE-FILE: $f ====="; cat "$f"; done
          for f in shots/*.png; do [ -f "$f" ] || continue; echo "===== EVIDENCE-PNG-B64: $f ====="; base64 -w0 "$f"; echo; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-evidence
          path: quizgate-redesign/shots/
