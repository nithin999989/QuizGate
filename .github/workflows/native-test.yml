name: native-test
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-test
  cancel-in-progress: false
jobs:
  native-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore binary assets
        run: bash quizgate-redesign/ci/restore-binaries.sh
      - name: Build app
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: Emulator evidence run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: default
          arch: x86_64
          emulator-options: -no-snapshot-save -no-window -no-audio -gpu swiftshader_indirect
          script: bash ci/run-emulator-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-test-evidence
          path: shots/
